; Réglages PHP du proxy Albert (lus automatiquement par l'hébergement).
; Taille maximale des fichiers audio et documents envoyés à Albert (100 Mo pour la transcription).
upload_max_filesize = 100M
; Un peu plus que le fichier lui-même : l'envoi contient aussi les autres champs du formulaire.
post_max_size = 110M
max_execution_time = 600
max_input_time = 600
; Les avertissements PHP ne doivent pas se mêler aux réponses JSON du proxy.
display_errors = Off
; Retransmission immédiate des réponses du chat.
output_buffering = Off
zlib.output_compression = Off
