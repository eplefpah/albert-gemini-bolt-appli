; Réglages PHP du proxy Albert (lus automatiquement par l'hébergement).
; Taille maximale des fichiers audio et documents envoyés à Albert.
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 600
; Retransmission immédiate des réponses du chat.
output_buffering = Off
zlib.output_compression = Off
